name: Release APK

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      GLAD_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      GLAD_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      GLAD_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=0.0.0-manual.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Decode release keystore (only when secrets are configured)
        id: signing
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$GLAD_KEYSTORE_PASSWORD" ] && [ -n "$GLAD_KEY_ALIAS" ] && [ -n "$GLAD_KEY_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/glad-release.jks"
            echo "GLAD_KEYSTORE_FILE=$RUNNER_TEMP/glad-release.jks" >> "$GITHUB_ENV"
            echo "mode=release-signed" >> "$GITHUB_OUTPUT"
          else
            echo "mode=debug-signed" >> "$GITHUB_OUTPUT"
            echo "::warning::Release signing secrets are not configured. This APK is signed with the debug key."
          fi

      - name: Build release APK
        run: |
          gradle :app:assembleRelease \
            -PgladVersionName="${{ steps.version.outputs.name }}" \
            -PgladVersionCode=${{ github.run_number }} \
            --stacktrace

      - name: Prepare the asset
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk dist/Glad.apk
          (cd dist && sha256sum Glad.apk > Glad.apk.sha256)

      - uses: actions/upload-artifact@v4
        with:
          name: Glad-${{ steps.version.outputs.name }}-${{ steps.signing.outputs.mode }}
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="$GITHUB_REF_NAME"
          if [ "${{ steps.signing.outputs.mode }}" = "debug-signed" ]; then
            TITLE="Glad ${TAG} (debug-signed)"
            NOTE=$'> **Debug-signed build.** No release keystore is configured for this repository, so this APK is signed with the debug key. It installs and runs normally, but updates only work between builds signed with the same key. See the README for how to add a permanent signing key.\n\n'
          else
            TITLE="Glad ${TAG}"
            NOTE=""
          fi
          BODY="${NOTE}Install: download **Glad.apk** below, open it on your Android phone (8.0 or newer) and allow installs from your browser or file manager when asked.

          SHA-256 is attached as Glad.apk.sha256."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/Glad.apk dist/Glad.apk.sha256 --clobber
            gh release edit "$TAG" --title "$TITLE" --notes "$BODY"
          else
            gh release create "$TAG" dist/Glad.apk dist/Glad.apk.sha256 --title "$TITLE" --notes "$BODY" --verify-tag
          fi
